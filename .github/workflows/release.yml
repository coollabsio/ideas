name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Check tag matches Cargo version
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          TAG="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$TAG" || {
            echo "Cargo version $VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          }

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all --all-features

      - name: Build release binary
        run: cargo build --release -p ideas-server

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/release/ideas dist/ideas
          tar -C dist -czf ideas-linux-x86_64.tar.gz ideas
          sha256sum ideas-linux-x86_64.tar.gz > ideas-linux-x86_64.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ideas-linux-x86_64.tar.gz
            ideas-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
