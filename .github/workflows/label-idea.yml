name: Label idea issues

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]

permissions:
  issues: write

jobs:
  label:
    if: ${{ !github.event.issue.pull_request && !contains(github.event.issue.labels.*.name, 'notanidea') }}
    runs-on: ubuntu-latest
    steps:
      - name: Add idea label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/labels" \
            -d '{"labels":["idea"]}'

  remove-idea-when-excluded:
    if: ${{ !github.event.issue.pull_request && github.event.action == 'labeled' && github.event.label.name == 'notanidea' }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove idea label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          status=$(curl -sS -o /tmp/remove-idea-label-response.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/labels/idea")
          if [ "${status}" != "200" ] && [ "${status}" != "404" ]; then
            cat /tmp/remove-idea-label-response.json
            exit 1
          fi
